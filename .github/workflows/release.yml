name: Release

# Tags carry no `v` prefix (2.0.5); the release it creates is titled with one (v2.0.5).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The tag names the release; gradle.properties decides what actually gets
      # built into the ZIP. A mismatch would ship 1.0.0 under a 1.0.1 release.
      # GITHUB_REF_NAME is read from the environment rather than interpolated into
      # the script, so a hostile tag name cannot break out into the shell.
      - name: Check tag matches gradle.properties
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match version '$version' in gradle.properties"
            exit 1
          fi

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: v${{ github.ref_name }}
          files: build/distributions/*.zip
          # The hand-written notes lead; GitHub's generated commit list is appended below them.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
