name: Release

# Tags carry no `v` prefix (2.0.5); the release it creates is titled with one (v2.0.5).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The tag names the release; gradle.properties decides what actually gets
      # built into the ZIP. A mismatch would ship 1.0.0 under a 1.0.1 release.
      # GITHUB_REF_NAME is read from the environment rather than interpolated into
      # the script, so a hostile tag name cannot break out into the shell.
      - name: Check tag matches gradle.properties
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match version '$version' in gradle.properties"
            exit 1
          fi

      # A release is public and permanent, so the checks run here too rather than trusting that the
      # tagged commit is the one master last verified — nothing stops a tag landing on a commit that
      # was never on a green master. `build` is the one that runs ktlint and the tests: neither
      # `buildPlugin` nor `verifyPlugin` depends on `test`, so without this step a tag could ship to
      # both the GitHub release and the Marketplace with the suite unrun. It goes first because it
      # fails in seconds, before the verifier spends minutes fetching its IDEs.
      - name: Build and test
        run: ./gradlew build

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin

      - name: Build plugin
        run: ./gradlew buildPlugin

      # RELEASE_NOTES.md keeps every release's prose, newest first, under one `# vMAJOR.MINOR.PATCH`
      # heading each. Only the section belonging to this tag is published: printing starts at the
      # matching heading and stops at the next `# v`, so the file's opening HTML comment and every
      # older release fall outside it without needing to be stripped. The heading itself is kept,
      # because that is how the bodies of 1.1.0 and 1.1.1 were published.
      #
      # An empty result means the section was never written, and that is fatal. GitHub would
      # otherwise publish a release whose entire body is its own generated commit list — recoverable
      # only by editing the release afterwards, which the tag cannot redo.
      #
      # GITHUB_REF_NAME comes through the environment rather than `${{ }}` interpolation, for the
      # same reason as the tag check above.
      - name: Prepare the release body
        run: |
          body="$(awk -v heading="# v$GITHUB_REF_NAME" '
            /^# v/ { inSection = ($0 == heading) }
            inSection { print }' RELEASE_NOTES.md)"
          if [ -z "$body" ]; then
            echo "::error::RELEASE_NOTES.md has no '# v$GITHUB_REF_NAME' section"
            exit 1
          fi
          printf '%s\n' "$body" > release-body.md
          echo "::notice::Release body: $(wc -l < release-body.md) lines, starting '$(head -n 1 release-body.md)'"

      # Before publishPlugin, which also produces a *-signed.zip: attaching the release here keeps
      # exactly one ZIP on it instead of two near-identically named ones.
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: v${{ github.ref_name }}
          files: build/distributions/*.zip
          # The hand-written notes lead; GitHub's generated commit list is appended below them.
          body_path: release-body.md
          generate_release_notes: true

      # The `secrets` context is not available in a step `if`, so presence is turned into an output
      # here. Keeping the secrets scoped to the two steps that need them beats a job-level `env`,
      # which would hand them to every third-party action in this job as well.
      - name: Check for Marketplace credentials
        id: credentials
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          if [ -n "$PUBLISH_TOKEN" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # Marketplace publishing is opt-in: with no secrets configured this is skipped and the GitHub
      # release above still happens, rather than every future tag failing on absent credentials.
      # Marketplace also requires the first upload of a plugin to be made by hand.
      - name: Publish to JetBrains Marketplace
        if: steps.credentials.outputs.configured == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      - name: Note that Marketplace publishing was skipped
        if: steps.credentials.outputs.configured != 'true'
        run: |
          echo "::notice::Published to GitHub only. Set PUBLISH_TOKEN, CERTIFICATE_CHAIN, PRIVATE_KEY and PRIVATE_KEY_PASSWORD to also publish to the JetBrains Marketplace."
