name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an in-flight run obsolete, and these runs are long: a cold
# cache pulls a full IntelliJ IDEA distribution. Cancelling frees the runner for
# the commit anyone is actually waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The first run downloads an entire IntelliJ IDEA distribution plus the Plugin
    # Verifier's IDEs. Later runs hit the Gradle cache and finish far quicker.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gradle-wrapper.jar is committed to this repo, so confirm it is a genuine
      # one and not a tampered build.
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The same guard `make check` runs locally: nothing in the build resolves the
      # catalog's gradle-wrapper entry, so it can drift from the wrapper properties.
      - name: Check wrapper matches the catalog
        run: make check-wrapper

      # release.yml only ever runs on a tag, so without this nothing checks it between releases —
      # which is how a `secrets` context in a step `if`, invalid and fatal at release time, once got
      # as far as being committed. Pinned by version and checksum rather than pulled through a
      # third-party action, to match how the `uses:` refs above are pinned.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz

      # Before the build: a formatting violation should be reported in seconds rather than after a
      # full IDE download and verifier run.
      - name: Check formatting
        run: ./gradlew lintKotlin

      - name: Build and test
        run: ./gradlew build

      # `build` already ran the tests and koverVerify, which is the gate; this only renders the XML
      # Kover report that Codecov reads. It covers the unit-testable layer only — build.gradle.kts
      # excludes the action, group and configurable classes, which need a running IDE.
      - name: Generate coverage report
        run: ./gradlew koverXmlReport

      # The `secrets` context is not available in a step `if`, so presence is turned into an output
      # and tested through that — the same shape, and the same reason, as release.yml's Marketplace
      # credential check.
      - name: Check for Codecov token
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # Opt-in, like Marketplace publishing: with no token set this is skipped and the build still
      # passes, rather than every PR failing on an absent secret. `fail_ci_if_error` stays false
      # because Codecov is a third-party service reporting numbers — koverVerify is what enforces
      # them, and an outage there should not redden a build whose coverage gate already passed.
      - name: Upload coverage to Codecov
        if: steps.codecov.outputs.configured == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin

      - name: Package plugin
        run: ./gradlew buildPlugin

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            build/reports/tests/test/
            build/reports/pluginVerifier/
          retention-days: 7
